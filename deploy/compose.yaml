# Sibillo on one host with Docker Compose (OPS-001, ADR-0054).
#
#   docker compose run --rm --no-deps init   # writes .env with fresh secrets
#   docker compose up --detach --build --wait
#   docker compose run --rm setup            # creates the first administrator
#
# Only the API is published (OPS-003). Every setting comes from .env; see
# specs/contracts/configuration.md.

name: sibillo

# Logs stay in Docker, for `docker compose logs`, at most 3 files of 10 MB
# per service, the oldest dropped first (OBS-005, ADR-0104).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-server: &server
  image: sibillo/server:${SIBILLO_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/images/server/Dockerfile
  networks: [internal]
  restart: unless-stopped
  logging: *logging
  # No process gains a privilege it did not start with (ADR-0129).
  security_opt: ["no-new-privileges:true"]

x-app-database: &app-database
  SIBILLO_DATABASE_URL: postgresql://sibillo_app:${SIBILLO_APP_PASSWORD:-}@postgres:5432/sibillo

x-owner-database: &owner-database
  SIBILLO_DATABASE_URL: postgresql://sibillo_owner:${SIBILLO_OWNER_PASSWORD:-}@postgres:5432/sibillo

# Backups and restores read the database as PostgreSQL's superuser (ADR-0077).
x-backup-environment: &backup-environment
  SIBILLO_DATABASE_URL: postgresql://postgres:${SIBILLO_POSTGRES_PASSWORD:-}@postgres:5432/sibillo
  SIBILLO_SECRET_KEY: ${SIBILLO_SECRET_KEY:-}
  SIBILLO_BACKUP_KEY: ${SIBILLO_BACKUP_KEY:-}
  SIBILLO_SANDBOXD_URL: http://sandboxd:8100/v1
  SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
  SIBILLO_BACKUP_TIME: ${SIBILLO_BACKUP_TIME:-03:00}
  SIBILLO_BACKUP_KEEP: ${SIBILLO_BACKUP_KEEP:-14}

networks:
  # Where the services meet; it reaches nothing outside (OPS-003, ADR-0134).
  internal:
    internal: true
  # The way out of the API and the worker: providers, MCP servers, push services, and the published port.
  egress: {}
  # The worker and the search service, and nothing else (ADR-0075).
  search: {}
  # The sandbox engine's way out, and nothing else (SBX-025, ADR-0114).
  sandboxes: {}

volumes:
  postgres: {}
  # The sandbox engine's Docker: sandboxes, their images and the workspaces (ADR-0114).
  engine: {}
  # The engine's Docker socket, for the sandbox driver alone (SBX-009, SBX-025).
  engine-socket: {}
  # The network guard's socket, for the sandbox driver alone (ADR-0113).
  netguard-socket: {}

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${SIBILLO_POSTGRES_PASSWORD:-}
      SIBILLO_OWNER_PASSWORD: ${SIBILLO_OWNER_PASSWORD:-}
      SIBILLO_APP_PASSWORD: ${SIBILLO_APP_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/initdb.sh:/docker-entrypoint-initdb.d/10-sibillo.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--dbname", "sibillo"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  migrate:
    <<: *server
    # No capability, and a read-only root filesystem but for /tmp (ADR-0134).
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment:
      <<: *owner-database
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *server
    # No capability, and a read-only root filesystem but for /tmp (ADR-0134).
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [internal, egress]
    command: ["sibillo_server", "api"]
    environment:
      <<: *app-database
      SIBILLO_HTTP_PORT: "8000"
      SIBILLO_SECRET_KEY: ${SIBILLO_SECRET_KEY:-}
      SIBILLO_TRUSTED_PROXIES: ${SIBILLO_TRUSTED_PROXIES:-}
      SIBILLO_UPLOAD_MAX_MB: ${SIBILLO_UPLOAD_MAX_MB:-1024}
      # The origin users open; without it, passkeys are unavailable (ADR-0094).
      SIBILLO_PUBLIC_ORIGIN: ${SIBILLO_PUBLIC_ORIGIN:-}
      SIBILLO_SANDBOXD_URL: http://sandboxd:8100/v1
      SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
      # A failing backup makes the health degraded (OPS-011).
      SIBILLO_BACKUP_STATUS: /backups/status.json
    volumes:
      - ${SIBILLO_BACKUP_DIR:-./backups}:/backups:ro
    # The single entry point (OPS-003); HTTPS comes from a reverse proxy.
    ports:
      - "${SIBILLO_PUBLISH:-127.0.0.1:8080}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandboxd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 40

  worker:
    <<: *server
    # No capability, and a read-only root filesystem but for /tmp (ADR-0134).
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["sibillo_server", "worker"]
    environment:
      <<: *app-database
      SIBILLO_SECRET_KEY: ${SIBILLO_SECRET_KEY:-}
      SIBILLO_RUN_RETENTION_DAYS: ${SIBILLO_RUN_RETENTION_DAYS:-30}
      SIBILLO_TEMPORARY_SWEEP_SECONDS: ${SIBILLO_TEMPORARY_SWEEP_SECONDS:-600}
      SIBILLO_APPROVAL_SWEEP_SECONDS: ${SIBILLO_APPROVAL_SWEEP_SECONDS:-60}
      SIBILLO_TASK_SWEEP_SECONDS: ${SIBILLO_TASK_SWEEP_SECONDS:-30}
      SIBILLO_RUN_REQUEST_LIMIT: ${SIBILLO_RUN_REQUEST_LIMIT:-200}
      SIBILLO_MCP_CALL_SECONDS: ${SIBILLO_MCP_CALL_SECONDS:-120}
      SIBILLO_PUBLIC_ORIGIN: ${SIBILLO_PUBLIC_ORIGIN:-}
      SIBILLO_SANDBOXD_URL: http://sandboxd:8100/v1
      SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
      SIBILLO_SEARCH_URL: http://search:8080
    networks: [internal, egress, search]
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandboxd: { condition: service_healthy }
      search: { condition: service_healthy }

  sandboxd:
    image: sibillo/sandboxd:${SIBILLO_IMAGE_TAG:-local}
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # What it reads of sandboxes cannot take the host's memory (SBX-011, ADR-0129).
    mem_limit: 1g
    build:
      context: ..
      dockerfile: deploy/images/sandboxd/Dockerfile
    environment:
      SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
      # The engine's Docker, never the host's (SBX-025).
      DOCKER_HOST: unix:///run/sibillo-engine/docker.sock
      # The sandbox image as the engine names it.
      SIBILLO_SANDBOX_IMAGE: sibillo/sandbox:engine
      SIBILLO_NETGUARD_SOCKET: /run/sibillo-netguard-socket/guard.sock
      SIBILLO_SANDBOX_MINIMUM_GVISOR_RELEASE: ${SIBILLO_SANDBOX_MINIMUM_GVISOR_RELEASE:-}
      SIBILLO_SANDBOX_RESOLVER: ${SIBILLO_SANDBOX_RESOLVER:-9.9.9.9}
      SIBILLO_SANDBOX_CPUS: ${SIBILLO_SANDBOX_CPUS:-1}
      SIBILLO_SANDBOX_MEMORY_MB: ${SIBILLO_SANDBOX_MEMORY_MB:-1024}
      SIBILLO_SANDBOX_PROCESSES: ${SIBILLO_SANDBOX_PROCESSES:-512}
      SIBILLO_SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SIBILLO_SANDBOX_COMMAND_TIMEOUT_SECONDS:-300}
      SIBILLO_SANDBOX_MAX_OUTPUT_BYTES: ${SIBILLO_SANDBOX_MAX_OUTPUT_BYTES:-1048576}
      SIBILLO_SANDBOX_IDLE_MINUTES: ${SIBILLO_SANDBOX_IDLE_MINUTES:-5}
      SIBILLO_SANDBOX_WORKSPACE_QUOTA_MB: ${SIBILLO_SANDBOX_WORKSPACE_QUOTA_MB:-2048}
      SIBILLO_SANDBOX_DISK_MB: ${SIBILLO_SANDBOX_DISK_MB:-4096}
    # The only service with the container runtime, the sandbox engine's (SBX-009, SBX-025).
    volumes:
      - engine-socket:/run/sibillo-engine
      - netguard-socket:/run/sibillo-netguard-socket
    depends_on:
      engine: { condition: service_healthy }
      netguard: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8100/v1/health', headers={'Authorization': 'Bearer ' + os.environ['SIBILLO_SANDBOXD_TOKEN']}), timeout=5)"
      interval: 3s
      timeout: 10s
      retries: 60
    networks: [internal]
    restart: unless-stopped

  # Backs the instance up every night, keeping the newest archives (OPS-010, ADR-0077).
  backup:
    <<: *server
    command: ["sibillo_server", "backup", "--schedule"]
    # Writes archives into the host's backup folder.
    user: "0:0"
    environment:
      <<: *backup-environment
    volumes:
      - ${SIBILLO_BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandboxd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "test", "-f", "/backups/status.json"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Restores an archive: `docker compose run --rm restore /backups/FILE` (OPS-006).
  restore:
    <<: *server
    entrypoint: ["python", "-m", "sibillo_server", "restore", "--config", "/config/.env"]
    command: []
    user: "0:0"
    environment:
      <<: *backup-environment
    volumes:
      - ${SIBILLO_CONFIG_DIR:-.}:/config
      - ${SIBILLO_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
      sandboxd: { condition: service_healthy }
    restart: "no"
    profiles: [operator]

  # The search service (ADR-0075): SearXNG, which only the worker reaches.
  search:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    # Its secret, for its own pages, is new at every start.
    entrypoint:
      - /bin/sh
      - -c
      - export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"; exec /usr/local/searxng/entrypoint.sh
    environment:
      # The settings are mounted read-only.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./search/settings.yml:/etc/searxng/settings.yml:ro
    # SearXNG logs failed engine requests with their queries: no logs (OBS-001).
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 40
    networks: [search]
    restart: unless-stopped

  netguard:
    image: sibillo/netguard:${SIBILLO_IMAGE_TAG:-local}
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/images/netguard/Dockerfile
    # The sandbox engine's network namespace and NET_ADMIN, nothing else, and
    # never host networking (ADR-0021, SBX-025). A guard whose engine restarted
    # stops, and starts again in the engine's new namespace.
    network_mode: service:engine
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/run/sibillo-netguard]
    # DNS from sandboxes reaches only this resolver, as the driver's (SBX-007, ADR-0098).
    environment:
      SIBILLO_SANDBOX_RESOLVER: ${SIBILLO_SANDBOX_RESOLVER:-9.9.9.9}
      SIBILLO_NETGUARD_SOCKET: /run/sibillo-netguard-socket/guard.sock
    volumes:
      - netguard-socket:/run/sibillo-netguard-socket
    depends_on:
      engine: { condition: service_healthy, restart: true }
    stop_grace_period: 15s
    restart: unless-stopped

  # The sandbox engine (SBX-025, ADR-0114): a Docker Engine of its own with
  # gVisor in it, where the sandboxes run. The only privileged service; it
  # listens on its Unix socket only, and the host's Docker socket is mounted
  # nowhere.
  engine:
    image: sibillo/engine:${SIBILLO_IMAGE_TAG:-local}
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/images/engine/Dockerfile
      additional_contexts:
        sandbox-image: service:sandbox
    privileged: true
    volumes:
      - engine:/var/lib/docker
      - engine-socket:/run/sibillo-engine
    # The service that builds the sandbox image has ended, as `up --wait` expects of it.
    depends_on:
      sandbox: { condition: service_completed_successfully }
    networks: [sandboxes]
    stop_grace_period: 30s
    restart: unless-stopped

  # Builds the sandbox image for the engine, then exits.
  sandbox:
    image: sibillo/sandbox:${SIBILLO_IMAGE_TAG:-local}
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/images/sandbox/Dockerfile
    command: ["true"]
    network_mode: none
    restart: "no"

  init:
    <<: *server
    command: ["sibillo_server", "init", "--output", "/config/.env"]
    user: "0:0"
    volumes:
      - ${SIBILLO_CONFIG_DIR:-.}:/config
    networks: []
    network_mode: none
    restart: "no"
    profiles: [operator]

  setup:
    <<: *server
    command: ["sibillo_server", "setup"]
    environment:
      <<: *owner-database
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"
    profiles: [operator]
